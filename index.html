<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Defensa del Castillo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.70.0/phaser.min.js"></script>
</head>
<body>
<div id="wrap">
  <div id="topbar">
    <span>🪙 <b id="goldTxt">150</b></span>
    <span>❤️ <b id="lifeTxt">20</b></span>
    <span>⚔️ Asalto <b id="waveTxt">0</b></span>
    <span id="bossTag" style="display:none;">👑 ¡Jefe en camino!</span>
    <div id="speedControls">
      <button id="pauseBtn" class="iconBtn" title="Pausa">⏸️</button>
      <button id="speedBtn" class="iconBtn" title="Velocidad x2">⏩</button>
    </div>
  </div>
  <div id="gameHost">
    <div id="pauseOverlay">⏸ En pausa</div>
    <div id="msg"><div id="msgTitle"></div><button id="restartBtn">Reiniciar</button></div>
  </div>
  <div id="bottombar">
    <div id="buildButtons">
      <div class="btn" id="towerBasic" data-tower="basic">🏹 Arqueros<small>50</small></div>
      <div class="btn" id="towerSlow" data-tower="slow">🧙 Hechicero<small>75</small></div>
      <div class="btn" id="towerArea" data-tower="area">🪨 Catapulta<small>110</small></div>
      <div class="btn" id="waveBtn">⚔️ ¡Que ataquen!</div>
    </div>
    <div id="towerPanel">
      <div id="towerPanelInfo"></div>
      <div id="towerPanelActions">
        <div class="btn" id="upgradeBtn">⬆️ Mejorar<small id="upgradeCost"></small></div>
        <div class="btn" id="sellBtn">💰 Vender<small id="sellValue"></small></div>
        <div class="btn" id="closeTowerPanel">✖️ Cerrar</div>
      </div>
    </div>
  </div>
</div>

<!-- Módulos del juego, en orden de dependencia -->
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/entities.js"></script>
<script src="js/towers.js"></script>
<script src="js/scene.js"></script>
<script src="js/main.js"></script>
</body>
</html>
